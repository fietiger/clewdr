name: frontend

# Fork-local workflow. Upstream builds through nix on master/tags only; this
# one exists so a change on any branch gets compiled and produces a
# downloadable static bundle without a local Rust toolchain.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Build frontend (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clewdr-frontend

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Type-check frontend
        working-directory: clewdr-frontend
        run: cargo check --target wasm32-unknown-unknown

      - name: Build frontend
        working-directory: clewdr-frontend
        run: trunk build --release

      - name: Upload static bundle
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: static/
          retention-days: 7

  # The server links BoringSSL through wreq -> btls-sys, so the C++ toolchain
  # (cmake/perl/nasm) and libclang for bindgen have to be present before cargo
  # can even check the crate. `--no-default-features` plus the two runtime
  # features keeps embed-resource out of the way, since that one needs a
  # built static/ directory to exist at compile time.
  backend:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake perl nasm clang libclang-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check server
        run: cargo check -p clewdr --no-default-features --features external-resource,portable
